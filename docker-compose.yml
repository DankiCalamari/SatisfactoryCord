services:
  satisfactorycord:
    build: .
    restart: unless-stopped
    ports:
      - "7777:7777/tcp"
      - "7777:7777/udp"
      - "8888:8888/tcp"
      - "3000:3000/tcp"
    volumes:
      - ./satisfactory:/satisfactory
      - ./data:/app/data
      - ./wrapper-logs:/app/logs
      - ./backups:/backups
    env_file:
      - .env
